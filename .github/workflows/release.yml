# Release: on a version tag (v*), publish the extension as a zip and a signed SLSA build provenance
# file (*.intoto.jsonl) next to it, so anyone can check the zip was built here, from that tag.
name: Release

on:
  push:
    tags: ["v*"]
  # Re-run for an existing tag (e.g. a release made before this workflow) to attach its provenance.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attest (e.g. v1.0.0)
        required: true

permissions: read-all

jobs:
  build:
    name: Build release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    outputs:
      tag: ${{ steps.hash.outputs.tag }}
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Build zip
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: git archive --format=zip --prefix=LKND-ghost-text/ -o "LKND-ghost-text-${TAG}.zip" "$TAG" extension LICENSE README.md SECURITY.md

      - name: Hash
        id: hash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "hashes=$(sha256sum "LKND-ghost-text-${TAG}.zip" | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "LKND-ghost-text-${TAG}.zip" -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "LKND-ghost-text-${TAG}.zip" -R "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
          fi

  provenance:
    name: Signed provenance
    needs: build
    permissions:
      actions: read # read the workflow run
      id-token: write # keyless Sigstore signing
      contents: write # attach the provenance to the release
    # Reusable workflows from slsa-github-generator must be referenced by tag (Scorecard allows it).
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ needs.build.outputs.tag }}
      provenance-name: LKND-ghost-text-${{ needs.build.outputs.tag }}.intoto.jsonl
